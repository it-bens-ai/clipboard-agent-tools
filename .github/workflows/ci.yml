name: CI

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'plugin-tests/**'
      - '.mcp-sdk.lock'
      - '.shellcheckrc'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/npm-publish.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
  pull_request:
    paths:
      - 'plugins/**'
      - 'plugin-tests/**'
      - '.mcp-sdk.lock'
      - '.shellcheckrc'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/npm-publish.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'

jobs:
  bash:
    name: Bash Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      # The Node tests run the hook scripts, which need jq.
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check manifests agree on the version
        run: ./.github/scripts/check-versions.sh

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Node unit tests
        run: npm test

      - name: Install ShellCheck
        run: |
          SHELLCHECK_VERSION="v0.11.0"
          ARCH=$(uname -m)
          wget -q "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
          tar -xJf "shellcheck-${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version

      - name: ShellCheck
        run: |
          find plugins plugin-tests .github/scripts -type f \
            \( -name '*.sh' -o -name '*.bats' -o -name '*.bash' \) \
            -exec shellcheck --shell=bash --format=gcc {} +

      - name: Vendored SDK matches the pinned release
        run: ./.github/scripts/vendor-mcp-sdk.sh --check

      - name: Setup BATS
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: true
          assert-install: true
          assert-version: 2.2.4
          detik-install: false
          file-install: false
          support-path: ${{ github.workspace }}/.bats/bats-support
          assert-path: ${{ github.workspace }}/.bats/bats-assert

      - name: BATS
        run: bats -r plugin-tests/
