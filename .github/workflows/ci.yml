name: CI

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'plugin-tests/**'
      - '.mcp-sdk.lock'
      - '.shellcheckrc'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/npm-publish.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
  pull_request:
    paths:
      - 'plugins/**'
      - 'plugin-tests/**'
      - '.mcp-sdk.lock'
      - '.shellcheckrc'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/npm-publish.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'

jobs:
  bash:
    name: Bash Tests & Lint (Pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Pi release. Raise it by hand when support for older releases ends.
          - pi: oldest
            pi-version: 1.0.0
          # The release pinned in package.json devDependencies. Renovate bumps it.
          - pi: latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install npm dependencies
        run: npm ci

      - name: Install the oldest supported Pi
        if: matrix.pi-version
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          npm install --no-save \
            "@earendil-works/pi-coding-agent@${PI_VERSION}" \
            "@earendil-works/pi-ai@${PI_VERSION}"
          for PKG in "@earendil-works/pi-coding-agent" "@earendil-works/pi-ai"; do
            INSTALLED=$(node -e 'const { readFileSync } = require("node:fs"); const pkg = JSON.parse(readFileSync("node_modules/" + process.argv[1] + "/package.json", "utf8")); process.stdout.write(pkg.version);' "${PKG}")
            if [[ "${INSTALLED}" != "${PI_VERSION}" ]]; then
              echo "::error::${PKG} installed at ${INSTALLED}, expected ${PI_VERSION}"
              exit 1
            fi
          done

      # The Node tests run the hook scripts, which need jq.
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check manifests agree on the version
        run: ./.github/scripts/check-versions.sh

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Node unit tests
        run: npm test

      - name: Install ShellCheck
        run: |
          SHELLCHECK_VERSION="v0.11.0"
          ARCH=$(uname -m)
          wget -q "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
          tar -xJf "shellcheck-${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version

      - name: ShellCheck
        run: |
          find plugins plugin-tests .github/scripts -type f \
            \( -name '*.sh' -o -name '*.bats' -o -name '*.bash' \) \
            -exec shellcheck --shell=bash --format=gcc {} +

      - name: Vendored SDK matches the pinned release
        run: ./.github/scripts/vendor-mcp-sdk.sh --check

      - name: Setup BATS
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: true
          assert-install: true
          assert-version: 2.2.4
          detik-install: false
          file-install: false
          support-path: ${{ github.workspace }}/.bats/bats-support
          assert-path: ${{ github.workspace }}/.bats/bats-assert

      - name: BATS
        run: bats -r plugin-tests/
